# alembic.ini — FastAPI + SQLModel
# Run: alembic upgrade head  (or: alembic revision --autogenerate -m "msg")
# DB URL is env-driven; default is SQLite (libsql-compatible). Override via DATABASE_URL.
#   DATABASE_URL=sqlite:///./finance_app.db
#   DATABASE_URL=postgresql+psycopg://user:pass@localhost:5432/finance_app
#   DATABASE_URL=libsql://...

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = sqlite:///./finance_app.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
